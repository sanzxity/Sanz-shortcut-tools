        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid #2a3a5a; }
        h1 { font-size: 2.8rem; letter-spacing: 2px; background: linear-gradient(135deg, #00d4ff, #7b61ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { color: #8899bb; margin-top: 6px; font-size: 1rem; }
        .controls { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin: 25px 0 30px; }
        .controls input, .controls select { padding: 12px 20px; border-radius: 10px; border: 1px solid #2a3a5a; background: #121a28; color: #e0e6f0; font-size: 1rem; min-width: 200px; outline: none; }
        .controls input:focus, .controls select:focus { border-color: #00d4ff; box-shadow: 0 0 12px #00d4ff44; }
        .stats { display: flex; gap: 30px; justify-content: center; font-size: 0.9rem; color: #8899bb; margin-bottom: 20px; flex-wrap: wrap; }
        .stats span { background: #121a28; padding: 6px 18px; border-radius: 20px; border: 1px solid #2a3a5a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #121a28; border-radius: 14px; padding: 20px; border: 1px solid #1f2a3f; transition: 0.2s; }
        .card:hover { border-color: #00d4ff; transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,212,255,0.08); }
        .card .cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #00d4ff; background: #1a2a3f; display: inline-block; padding: 2px 12px; border-radius: 20px; margin-bottom: 8px; }
        .card h3 { font-size: 1.1rem; margin: 6px 0 4px; }
        .card p { font-size: 0.85rem; color: #8899bb; line-height: 1.4; }
        .card .link { display: inline-block; margin-top: 10px; color: #7b61ff; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .card .link:hover { color: #00d4ff; text-decoration: underline; }
        .footer { text-align: center; padding: 30px 0 10px; color: #556688; font-size: 0.8rem; border-top: 1px solid #1a2a3f; margin-top: 40px; }
        .no-result { text-align: center; padding: 40px; color: #8899bb; font-size: 1.2rem; }
        @media (max-width: 600px) { h1 { font-size: 2rem; } .controls input, .controls select { min-width: 100%; } }
    </style>
</head>

            { id:65, name:"Exa", cat:"utility", desc:"Modern ls replacement with colors.", link:"github.com/ogham/exa" },
        ];

        const grid = document.getElementById('gridContainer');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const totalSpan = document.getElementById('totalCount');
        const visibleSpan = document.getElementById('visibleCount');
        const noResultDiv = document.getElementById('noResult');

        function renderTools(filtered) {
            grid.innerHTML = '';
            if (filtered.length === 0) {
                noResultDiv.style.display = 'block';
                visibleSpan.textContent = 'Showing: 0';
                return;
            }
            noResultDiv.style.display = 'none';
            visibleSpan.textContent = `Showing: ${filtered.length}`;
            filtered.forEach(t => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="cat">${t.cat}</div>
                    <h3>${t.name}</h3>
                    <p>${t.desc}</p>
                    <a class="link" href="https://${t.link}" target="_blank" rel="noopener">${t.link} ↗</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterTools() {
            const search = searchInput.value.toLowerCase().trim();
            const cat = categoryFilter.value;
            let filtered = tools.filter(t => {
                const matchSearch = !search || 
                    t.name.toLowerCase().includes(search) || 
                    t.desc.toLowerCase().includes(search) ||
                    t.link.toLowerCase().includes(search);
                const matchCat = cat === 'all' || t.cat === cat;
                return matchSearch && matchCat;
            });
            renderTools(filtered);
        }

        // initial render
        totalSpan.textContent = `Total: ${tools.length} tools`;
        renderTools(tools);

        // event listeners
        searchInput.addEventListener('input', filterTools);
        categoryFilter.addEventListener('change', filterTools);
    })();
</script>
</body>
</html>
